<form class="mt-6 space-y-4" [formGroup]="form" (ngSubmit)="submit()">
  <label class="block text-sm font-medium">
    Email
    <input
      class="mt-1 w-full rounded border border-zinc-300 px-3 py-2"
      type="email"
      formControlName="email"
      autocomplete="off"
    />
  </label>
  @if (form.controls.email.touched && form.controls.email.invalid) {
    <p class="-mt-2 text-xs text-red-600">Enter a valid email address.</p>
  }

  <label class="block text-sm font-medium">
    Temporary password
    <input
      class="mt-1 w-full rounded border border-zinc-300 px-3 py-2"
      type="password"
      formControlName="password"
      autocomplete="new-password"
    />
  </label>
  @if (form.controls.password.touched && form.controls.password.invalid) {
    <p class="-mt-2 text-xs text-red-600">Use 8 to 72 characters.</p>
  }

  <button
    class="w-full cursor-pointer rounded bg-zinc-900 px-4 py-2 text-white hover:bg-zinc-700 disabled:cursor-not-allowed disabled:opacity-60"
    type="submit"
    [disabled]="submitting()"
  >
    {{ submitting() ? 'Creating…' : 'Create account' }}
  </button>
</form>
