<app-auth-card>
  <h1 class="text-2xl font-bold">Sign in</h1>
  <p class="mt-1 text-sm text-zinc-600">Access your SSFB account</p>

  @if (error(); as message) {
    <p class="mt-4 rounded bg-red-50 p-3 text-sm text-red-700" role="alert">{{ message }}</p>
  }

  <form class="mt-6 space-y-4" [formGroup]="form" (ngSubmit)="submit()">
    <label class="block text-sm font-medium">
      Email
      <input
        class="mt-1 w-full rounded border border-zinc-300 px-3 py-2"
        type="email"
        formControlName="email"
        autocomplete="username"
      />
    </label>
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <p class="-mt-2 text-xs text-red-600">Enter a valid email address.</p>
    }

    <label class="block text-sm font-medium">
      Password
      <input
        class="mt-1 w-full rounded border border-zinc-300 px-3 py-2"
        type="password"
        formControlName="password"
        autocomplete="current-password"
      />
    </label>
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <p class="-mt-2 text-xs text-red-600">Password is required.</p>
    }

    <button
      class="w-full cursor-pointer rounded bg-zinc-900 px-4 py-2 text-white hover:bg-zinc-700 disabled:cursor-not-allowed disabled:opacity-60"
      type="submit"
      [disabled]="submitting()"
    >
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</app-auth-card>
