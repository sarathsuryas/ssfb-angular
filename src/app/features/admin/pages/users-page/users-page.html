<section class="max-w-3xl">
  <div class="flex items-center justify-between gap-4">
    <h1 class="text-2xl font-bold">Users</h1>
    <button
      class="cursor-pointer rounded border border-zinc-300 px-3 py-1 text-sm hover:bg-zinc-100 disabled:opacity-60"
      type="button"
      [disabled]="loading()"
      (click)="load()"
    >
      Refresh
    </button>
  </div>

  @if (error(); as message) {
    <p class="mt-4 rounded bg-red-50 p-3 text-sm text-red-700" role="alert">{{ message }}</p>
  }

  @if (loading()) {
    <p class="mt-4 text-sm text-zinc-600">Loading users…</p>
  } @else if (users().length === 0) {
    <p class="mt-4 text-sm text-zinc-600">No users yet.</p>
  } @else {
    <table class="mt-4 w-full text-left text-sm">
      <thead class="border-b border-zinc-200 text-zinc-600">
        <tr>
          <th class="py-2">Email</th>
          <th class="py-2">Role</th>
          <th class="py-2">Created</th>
        </tr>
      </thead>
      <tbody>
        @for (user of users(); track user.id) {
          <tr class="border-b border-zinc-100">
            <td class="py-2">{{ user.email }}</td>
            <td class="py-2">{{ user.role }}</td>
            <td class="py-2">{{ user.createdAt | date: 'short' }}</td>
          </tr>
        }
      </tbody>
    </table>
  }
</section>
